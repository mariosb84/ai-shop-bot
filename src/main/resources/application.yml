spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-shop-bot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/aishop_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      #ddl-auto: update
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 9901

tg:
  username: ${TELEGRAM_BOT_USERNAME:shopAiHelp_bot}
  token: ${TELEGRAM_BOT_TOKEN}

logging:
  level:
    root: info
    org.example: DEBUG

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

app:
  multi-shop-enabled: false
  admin-chat-ids: ${ADMIN_CHAT_IDS:409923279}
  seed-test-data: ${SEED_TEST_DATA:true}